<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusicHub - Login</title>

    <link rel="shortcut icon" href="../imgs/Logo.svg" type="image/x-icon">

    <link rel="stylesheet" href="cadastro.css">
    <link rel="stylesheet" href="../styles/global.css">

    <!-- <script defer src=""></script> -->
</head>
<body>
            
    <main class="conteudo">

        <div class="cadastro-cabecalho">
                <img src="../imgs/Logo (1).svg" alt="Logo MusicHub">

                <h1>Reviva a estética dos anos 2000</h1>
                <p>Crie sua conta para entrar no ritmor</p>
            </div>

            
        <section class="cadastro">
        

            <form>
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input required type="email" id="email" placeholder="email@alunosenai.com">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input required type="password" id="senha" placeholder="************">
                        <button type="button" id="mostrar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <div class="campo">
                    <label for="confirme-senha">Confirme sua senha</label>
                    <div class="campo-ConfirmeSenha">
                        <input required type="password" id="senha" placeholder="************">
                        <button type="button" id="mostrar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>

                </div>

                <button class="botao-avancar">Avançar</button>

            </form>
        </section>
        <p> ou </p>
        <div class="botao">
        <button class="botao-google">
                    <img src="../imgs/icone-google.svg" alt="Logo Google">
                    <span>Continuar com Google</span>
                </button>
                <button class="botao-apple">
                    <img src="../imgs/icone-apple.png" alt="Logo Apple">
                    <span>Continuar com Apple</span>
                </button>
                </div>
    </main>
    <script src="cadastro.js"></script>
</body>
</html>
