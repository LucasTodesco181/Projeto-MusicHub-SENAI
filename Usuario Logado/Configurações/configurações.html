<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="configurações.css">
    <link rel="stylesheet" href="../../styles/global.css">
    <title>configurações</title>
</head>

<body>
    <header>
        <img src="../../imgs/Logo.svg" alt="Logo do site">
        <div class="navegacao">
            <img src="../../imgs/Inicio.svg" alt="icone de home">
            <div class="area-busca">
                <img src="../../imgs/Component.svg" alt="lupa que fica no campo de pesquisa">
                <input type="text" placeholder="Eai? Ta afim de ouvir oque?">
            </div>
            <img src="../../imgs/bussola.svg" alt="icone de bussula">
            <img src="../../imgs/Vector.svg" alt="icone de plalist">
        </div>
        <div class="info">
            <div class="container-botao">
                <a href="#" class="btn-planos">PLANOS</a>
            </div>
            <img src="../../imgs/Foto perfil.svg" alt="foto de perfil">
            <img src="../../imgs/Config.svg" alt="icone de configuração">
        </div>
    </header>
    <section class="configuracoes">
        <h1>configurações</h1>
        <div class="area-conta">
            <div class="info-conta">
                <h2>Conta</h2>
                <p>Nome de usuário • Premium • Segurança</p>
            </div>
            <div class="container-botao">
                <a href="#" class="btn-config">editar</a>
            </div>
        </div>
        <div class="area-reproducao">
            <h2>Reprodução</h2>
            <div class="transicao-gradual">
                <div class="info-reproducao">
                    <h3>Transição gradual</h3>
                    <p>Ajustar a duração da transição gradual entre os discos.</p>
                </div>
                <input type="radio">
            </div>
            <div class="transicao-gradual">
                <div class="info-reproducao">
                    <h3>Reprodução sem pausas </h3>
                    <p>Remova qualquer lacuna ou pausas entre os discos.</p>
                </div>
                <input type="radio">
            </div>
            <div class="transicao-gradual">
                <div class="info-reproducao">
                    <h3>Nível de volume</h3>
                    <p>Ajuste o volume de acordo com o ambiente.</p>
                </div>
                <div class="container-botao">
                    <input type="checkbox">
                </div>
            </div>
    </section>
</body>

</html>
