<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../../styles/global.css">
    <link rel="stylesheet" href="ConfiguracoesConta.css">

    <title>configurações de Conta</title>
</head>

<body>
    <!-- ========================================== -->
    <!-- CABEÇALHO / NAVEGAÇÃO PRINCIPAL            -->
    <!-- ========================================== -->
    <header class="header-logado">
        <!-- Logo -->
        <a href="#" class="container-link">
            <img src="../../imgs/Logo.svg" alt="Logo do site">
        </a>

        <!-- Menu Central e Campo de Busca -->
        <div class="navegacao">
            <a href="#" class="container-link">
                <img src="../../imgs/Inicio.svg" alt="icone de home">
            </a>
            <div class="area-busca">
                <img src="../../imgs/Component.svg" alt="lupa que fica no campo de pesquisa">
                <input type="text" placeholder="Eai? Ta afim de ouvir oque?">
            </div>
            <a href="#" class="container-link">
                <img src="../../imgs/bussola.svg" alt="icone de bussula">
            </a>
            <a href="#" class="container-link">
                <img src="../../imgs/Vector.svg" alt="icone de plalist">
            </a>
        </div>

        <!-- Perfil e Ações do Usuário -->
        <div class="info">
            <div class="container-botao">
                <a href="#" class="btn-planos">PLANOS</a>
            </div>
            <a href="#" class="container-link">
                <img src="../../imgs/Foto perfil.svg" alt="foto de perfil">
            </a>
            <a href="#" class="container-link">
                <img src="../../imgs/Config.svg" alt="icone de configuração">
            </a>
        </div>
    </header>
    <section class="ConfigucacoesConta">
        <div class="InfoConfigConta">
            <h1>conta</h1>
            <div class="AreaConfigConta">
                <h2>informações da conta</h2>
                <div class="AreaInfo">
                    <div class="AreaInput">
                        <h3>Nome</h3>
                        <div class="AreaDentroInput">
                            <input type="text" placeholder="@joaozinho">
                            <a href="#" class="container-editar">
                                <img src="../../imgs/botao de editar.svg" alt="botao de editar">
                            </a>
                        </div>
                    </div>
                    <div class="AreaInput">
                        <h3>Nome de usuário</h3>
                        <div class="AreaDentroInput">
                            <input type="text" placeholder="jão">
                            <a href="#" class="container-editar">
                                <img src="../../imgs/botao de editar.svg" alt="botao de editar">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="AreaConfigConta">
                <h2>informações pessoais</h2>
                <div class="AreaInfo">
                    <div class="AreaInput">
                        <h3>Email</h3>
                        <div class="AreaDentroInput">
                            <input type="text" placeholder="j***5@gmail.com">
                            <a href="#" class="container-editar">
                                <img src="../../imgs/botao de editar.svg" alt="botao de editar">
                            </a>
                        </div>
                    </div>
                    <div class="AreaInput">
                        <h3>Telefone</h3>
                        <div class="AreaDentroInput">
                            <input type="text" placeholder="Adicionar">
                            <a href="#" class="container-editar">
                                <img src="../../imgs/botao de editar.svg" alt="botao de editar">
                            </a>
                        </div>
                    </div>
                </div>
            </div>
            <div class="AreaConfigConta">
                <h2>Senha</h2>
                <div class="AreaInfoSenha">
                    <h3>Altere sua senha</h3>
                    <p>Para sua segurança, recomendamos enfaticamente que escolha uma senha única, que não seja usada
                        para
                        nenhuma outra conta on-line.
                    </p>
                    <div class="container-btn">
                        <button class="btn-AlterarSenha">Alterar senha</button>
                    </div>
                </div>
            </div>
        </div>
    </section>
</body>
