<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <link rel="stylesheet" href="../styles/global.css">
    <title>Página Login</title>
</head>
<body>

    <main class="conteudo-principal">

        <img src="../imgs/Logo (1).svg" alt="" class="logo">

        <div class="titulos">

        <h1 class="titulo-grande">Relembrou dos velhos tempos?</h1>
        <h2 class="titulo-pequeno">Bem-vindo(a) de volta! Loga aí e bora curtir!</h2>

        </div>

            <form class="login">
                <div class="campo">
                    <label for="email">E-mail</label>
                    <input   type="email" id="email" placeholder="nome@dominio.com">
                </div>

                <div class="campo">
                    <label for="senha">Senha</label>
                    <div class="campo-senha">
                        <input required type="password" id="senha" placeholder="************">
                        <button type="button" id="mostrar-senha" class="botao-olho">
                            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-eye"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>

                <button class="botao-entrar">Avançar</button>
            </form>

            

            <section class="opcoes">
                <p class="ou">ou</p>

                
                <div class="iconesgoogleapple">
                    <button class="botao-google">
                        <img src="../imgs/icone-google.svg" alt="Logo Google">
                        <span>Continuar com Google</span>
                    </button>
                    <button class="botao-apple">
                        <img src="../imgs/appleLogo.png" alt="Logo Google">
                        <span>Continuar com Apple</span>
                    </button>
                </div>

            </section>

            <section class="criar-conta">
                <p>Não tem uma conta ainda?</p>
                <a href="#">Crie uma aqui!</a>
            </section>

    </main>
</body>
</html>
