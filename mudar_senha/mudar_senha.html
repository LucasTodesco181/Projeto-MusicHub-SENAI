<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../mudar_senha/mudar_senha.css">
    <link rel="stylesheet" href="../styles/global.css">
    <title>Mudar Senha</title>
</head>
<body>
    <header class="cabecalho">
        <img src="../imgs/Logo.svg" alt="Logo MusicHub">
        <nav class="navegacao">
            <img src="../imgs/Inicio.svg" alt="inicio">
            <img src="../imgs/bussola.svg" alt="explorar">
            <img src="../imgs/pastinha-de-musica.svg" alt="">
            <img src="../imgs/btn - planos.svg" alt="planos">
            <img src="../imgs/Config.svg" alt="configuracao">
        </nav>
        
        <img src="../imgs/Foto perfil.svg" alt="foto de perfil">

        <div class="busca">
            <img src="../imgs/lupa.svg" alt="lupa">
            <input type="text" id="text" placeholder="Eai? Ta afim de ouvir oque?">
        </div>
        
    </header>
    <main class="principal">
        
        <section class="alterar_senha">
            <h1>alterar sua senha</h1>
            <div class="login">
                <label for="senha">insira sua senha</label>
                <input type="password" id="password" placeholder="********">
                <p>esqueceu? clique aqui para enviarmos um e-mail de confirmação</p>

                <label for="nova-senha">insira sua nova senha</label>
                <input type="password" id="password" placeholder="123***">

                <label for="Confirme sua nova senha">Confirme sua nova senha</label>
                <input type="password" id="password" placeholder="123***">
            </div>
            <button class="alterar">
                <img src="../imgs/caixinha avançar.svg" alt="alterar senha">
            </button>
        </section>
    </main>
</body>
</html>
