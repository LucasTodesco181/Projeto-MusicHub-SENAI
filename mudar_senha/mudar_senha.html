<!DOCTYPE html>
<html lang="PT-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../mudar_senha/mudar_senha.css">
    <link rel="stylesheet" href="../styles/global.css">
    <title>Mudar Senha</title>
</head>

<body>
    <header class="cabecalho">
        <div class="logo">
            <img src="../imgs/Logo.svg" alt="logo">

        </div>
        <div class="campo">
            <img src="../imgs/Inicio.svg" alt="">

            <div class="busca">

                <img src="../imgs/lupa.svg" alt="lupa">
                <input type="text" id="text" placeholder="Eai? Ta afim de ouvir oque?">

            </div>
            <div class="campo_busca">
                <img src="../imgs/bussola.svg" alt="explorar">
                <img src="../imgs/pastinha-de-musica.svg" alt="musicas">
            </div>
        </div>
        <div class="perfil">
            <img src="../imgs/btn - planos.svg" alt="entrar">
            <img src="../imgs/Foto perfil.svg" alt="foto">
            <img src="../imgs/Config.svg" alt="configuracao">
        </div>

    </header>
    <main class="principal">

        <section class="alterar_senha">
            <h1>alterar sua senha</h1>
            <div class="login">
                <div class="sua_senha">
                    <label for="senha">insira sua senha</label>
                    <input type="password" id="password" placeholder="********">
                    <p>esqueceu? clique aqui para enviarmos um e-mail de confirmação</p>
                </div>

                <div class="nova_senha">
                    <label for="nova-senha">insira sua nova senha</label>
                    <input type="password" id="password" placeholder="123***">
                </div>

                <div class="confirme_senha">
                    <label for="Confirme sua nova senha">Confirme sua nova senha</label>
                    <input type="password" id="password" placeholder="123***">
                </div>

                <div class="botao">
                    <button type="submit">
                        Alterar senha
                    </button>
                </div>
                
            </div>




        </section>
    </main>
</body>

</html>
